[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rofl"
version = "0.1.0"
description = "Helpers for building Rofi script modes"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py314"

[tool.setuptools.packages.find]
where = ["."]
include = ["rofl*"]
